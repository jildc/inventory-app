<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3a0b6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kinlove Inventory"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Kinlove Inventory</title>
<style>
:root{--pink:#f3a0b6;--pink2:#f8d7e0;--yellow:#ffe7a8;--yellow2:#fff7d9;--ink:#55454d;--muted:#8f7d85;--paper:#fffaf4;--line:#efd9df;--danger:#c45e78;--green:#68835e}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fffaf5,#fff5ef);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:980px;margin:auto;padding:14px 12px 42px}
header{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:28px;padding:16px;box-shadow:0 10px 32px #d99aaa1c;position:sticky;top:8px;z-index:5;backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:14px}.brand img{width:72px;height:72px;border-radius:20px;object-fit:cover;background:#fffaf5}.brand h1{font-size:28px;margin:0 0 3px}.brand p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.btn{border:1px solid var(--line);background:#fff;border-radius:15px;padding:11px 14px;font-weight:800;color:var(--ink)}.yellow{background:var(--yellow);border-color:#f4df9e}.pink{background:var(--pink2);border-color:#f0c6d2}.danger{color:var(--danger)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.tab{padding:15px;border:2px solid transparent;border-radius:18px;background:#fff;font-weight:850;color:var(--muted)}.tab.active{background:linear-gradient(135deg,var(--yellow),var(--pink2));border-color:#f0c7d2;color:var(--ink)}
.status{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 15px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.locked{color:var(--danger);font-weight:850}.unlocked{color:var(--green);font-weight:850}
.section{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;margin:13px 0}.section h2{margin:0;padding:15px 17px;background:linear-gradient(90deg,#fff3d2,#fde2e9);font-size:18px}.rows{padding:0 14px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px 3px;border-bottom:1px solid #f3e7e8}.row:last-child{border-bottom:0}.name{font-weight:750}.stamp{font-size:11px;color:var(--muted);margin-top:4px}.controls{display:flex;align-items:center;gap:6px}.qty{min-width:58px;text-align:center;font-size:18px;font-weight:900;background:var(--yellow2);border-radius:12px;padding:9px 7px}.mini{width:40px;height:40px;border:0;border-radius:12px;font-size:22px;font-weight:900}.minus{background:#f8d7e0}.plus{background:var(--pink);color:white}.trash{background:#fff;border:1px solid #efd1d8;color:var(--danger);font-size:16px}.note{grid-column:1/-1;width:100%;min-height:52px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:9px;background:#fffafc}.note:disabled{opacity:.62}.addline{display:flex;gap:8px;padding:13px 14px;border-top:1px dashed var(--line)}.addline input{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px}.empty{padding:18px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#35292e88;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.card{width:min(460px,100%);background:var(--paper);border-radius:24px;padding:22px;box-shadow:0 25px 70px #0004}.card h3{margin:0 0 8px}.card input,.card select{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;margin:7px 0 11px;background:white}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.hint{font-size:12px;color:var(--muted);line-height:1.45}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:11px 16px;border-radius:999px;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:640px){.brand img{width:62px;height:62px}.brand h1{font-size:23px}.row{grid-template-columns:1fr}.controls{justify-content:flex-end}.status{flex-direction:column;align-items:flex-start}}
</style></head>

function save(){localStorage.setItem('kinloveInventoryV4',JSON.stringify(data));} function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function now(){return new Date().toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'})}
function render(){const groups={}; data[current].forEach(i=>(groups[i.section]??=[]).push(i)); $('#inventory').innerHTML=''; for(const [section,items] of Object.entries(groups)){const el=document.createElement('section');el.className='section';el.innerHTML=`<h2>${esc(section)} <span>${items.length} items</span></h2><div class="rows"></div>`;const rows=el.querySelector('.rows');items.forEach(i=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<div><div class="name">${esc(i.name)}</div><div class="stamp">${i.updated?'Updated: '+esc(i.updated):'Not updated yet'}</div></div><div class="controls"><button class="mini minus" data-act="minus" data-id="${i.id}" ${data.locked?'disabled':''}>−</button><div class="qty">${i.qty}</div><button class="mini plus" data-act="plus" data-id="${i.id}" ${data.locked?'disabled':''}>+</button><button class="mini trash" data-act="delete" data-id="${i.id}" ${data.locked?'disabled':''}>🗑</button></div>${section.toLowerCase().includes('condiment')?`<textarea class="note" data-act="note" data-id="${i.id}" placeholder="Notes for this item..." ${data.locked?'disabled':''}>${esc(i.note||'')}</textarea>`:''}`;rows.appendChild(r)}); if(section==='Ice Cream'){const add=document.createElement('div');add.className='addline';add.innerHTML='<input placeholder="Add ice cream item"><button class="btn yellow">＋ Add</button>';add.querySelector('button').onclick=()=>{const n=add.querySelector('input').value.trim();if(n) addItem('Ice Cream',n)};rows.appendChild(add)} $('#inventory').appendChild(el)} updateStatus();}
function updateStatus(){$('#lockBtn').textContent=data.locked?'🔒 Unlock':'🔓 Lock';$('#statusText').textContent=data.locked?'🔒 Locked — inventory protected':'🔓 Unlocked — updates allowed';$('#statusText').className=data.locked?'locked':'unlocked';$('#lastUpdate').textContent=data.lastUpdate?'Last update: '+data.lastUpdate:'No updates yet';}
function snapshot(){data.history.push(JSON.stringify({foh:data.foh,kitchen:data.kitchen,lastUpdate:data.lastUpdate})); if(data.history.length>20)data.history.shift();}
function change(id,delta){if(data.locked)return;const i=data[current].find(x=>x.id===id);if(!i)return;snapshot();i.qty=Math.max(0,i.qty+delta);i.updated=now();data.lastUpdate=i.updated;save();render()}
function addItem(section,name,tab=current){if(data.locked)return; snapshot(); data[tab].push({id:crypto.randomUUID(),section,name,qty:0,updated:null,note:''});save();render();toast('Item added')}
function deleteItem(id){if(data.locked)return;const i=data[current].find(x=>x.id===id);if(!i)return;if(!confirm('Delete “'+i.name+'”?'))return;snapshot();data[current]=data[current].filter(x=>x.id!==id);save();render();toast('Item deleted')}
function openModal(mode){modalMode=mode;$('#modal').classList.add('show');$('#modalInput').value='';$('#modalTitle').textContent=mode==='unlock'?'Unlock inventory':mode==='password'?'Change password':'Confirm';$('#modalHint').textContent=mode==='unlock'?'Enter your password to edit quantities, add/remove items, or reset inventory.':mode==='password'?'Set a new password.':'Enter password.';$('#modalInput').type='password';setTimeout(()=>$('#modalInput').focus(),50)}
function closeModal(){$('#modal').classList.remove('show')} function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1700)}
$('#lockBtn').onclick=()=>data.locked?openModal('unlock'):(data.locked=true,save(),render()); $('#addBtn').onclick=()=>{if(data.locked)return openModal('unlock');openAdd()}; $('#resetBtn').onclick=()=>{if(data.locked)return openModal('unlock');if(confirm('Reset all quantities in this inventory to 0?')){snapshot();data[current].forEach(i=>{i.qty=0;i.updated=now()});data.lastUpdate=now();save();render();toast('Quantities reset')}}; $('#undoBtn').onclick=()=>{if(!data.history.length)return toast('Nothing to undo');if(data.locked)return openModal('unlock');const s=JSON.parse(data.history.pop());data.foh=s.foh;data.kitchen=s.kitchen;data.lastUpdate=s.lastUpdate;save();render();toast('Undone')}; $('#passBtn').onclick=()=>{if(data.locked)return openModal('unlock');openModal('password')};
$$('.tab').forEach(b=>b.onclick=()=>{current=b.dataset.tab;$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});
$('#inventory').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const id=b.dataset.id;if(b.dataset.act==='plus')change(id,1);if(b.dataset.act==='minus')change(id,-1);if(b.dataset.act==='delete')deleteItem(id)}); $('#inventory').addEventListener('input',e=>{if(e.target.dataset.act==='note'&&!data.locked){const i=data[current].find(x=>x.id===e.target.dataset.id);if(i){i.note=e.target.value;save()}}});
$('#cancelModal').onclick=closeModal; $('#okModal').onclick=()=>{const p=$('#modalInput').value;if(modalMode==='unlock'){if(p===data.password){data.locked=false;save();render();closeModal();toast('Inventory unlocked')}else toast('Incorrect password')}else if(modalMode==='password'){if(p.length<4)return toast('Use at least 4 characters');data.password=p;save();closeModal();toast('Password changed')}}; $('#modalInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('#okModal').click()});
function openAdd(){const section=prompt('Section name (e.g. Drinks, Condiments, Ice Cream):','Drinks');if(!section)return;const name=prompt('Item name:');if(name?.trim())addItem(section.trim(),name.trim())}
// First-run: keep the app locked. Password is 1234 until changed.
render(); if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
