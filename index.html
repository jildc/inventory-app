<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3a1b6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kinlove FOH">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="app-icon.png"><title>Kinlove FOH Inventory</title>
<style>
:root{--p:#f3a1b6;--pl:#f8d5df;--y:#ffe7a8;--bg:#fffaf5;--ink:#4d3d43;--muted:#8d7c82;--line:#f0dce1}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:linear-gradient(135deg,#fffaf5,#fff6ed);color:var(--ink);padding-bottom:30px}
header{padding:24px 16px;background:linear-gradient(100deg,#f4a1b5,#ffdca0);position:sticky;top:0;z-index:5;box-shadow:0 3px 15px #9c687020}.brand{display:flex;align-items:center;gap:13px;max-width:900px;margin:auto}.brand img{width:62px;height:62px;border-radius:50%;object-fit:cover;background:white}h1{font-size:24px;margin:0 0 4px}.sub{font-size:13px;color:#6d5b62}
main{max-width:900px;margin:18px auto;padding:0 14px}.toolbar{display:flex;gap:9px;margin-bottom:15px;flex-wrap:wrap}button{border:0;border-radius:14px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff;padding:13px 16px}.secondary{background:#fff;color:var(--ink);padding:13px 16px;border:1px solid var(--line)}
.category{background:#fff;border:1px solid #f0dfe3;border-radius:22px;padding:14px 16px;margin:14px 0;box-shadow:0 5px 18px #8d68750b}.cathead{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 11px;border-bottom:1px solid var(--line)}.cathead h2{font-size:20px;margin:0}.count{background:var(--y);padding:7px 11px;border-radius:12px;font-size:13px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.name{font-size:17px;font-weight:750}.updated{font-size:12px;color:var(--muted);margin-top:5px}.controls{display:flex;align-items:center;gap:6px}.qty{min-width:48px;text-align:center;background:var(--y);padding:12px 8px;border-radius:13px;font-size:18px;font-weight:800;color:#c45370}.minus,.plus{width:46px;height:46px;font-size:25px}.minus{background:var(--pl);color:#6a4d55}.plus{background:var(--p);color:#fff}.del{width:38px;height:38px;background:#fff0f3;color:#d66a82}
.modal{position:fixed;inset:0;background:#3d2d3440;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:600px;border-radius:25px 25px 0 0;padding:22px 18px 28px}.sheet h3{margin:0 0 15px;font-size:22px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 6px;color:var(--muted)}input,select{width:100%;padding:13px;border:1px solid #ead8de;border-radius:13px;font:inherit;background:#fffafc;color:var(--ink)}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;padding:13px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:25px;margin:20px}}
</style></head><body>
<header><div class="brand"><img src="app-icon.png" alt="Kinlove logo"><div><h1>Kinlove FOH Inventory</h1><div class="sub">Drinks • Food • Packaging • Bouquets</div></div></div></header>
<main><div class="toolbar"><button class="primary" id="addBtn">＋ Add Item</button><button class="secondary" id="resetBtn">Reset to Original Items</button></div><div id="inventory"></div></main>
<div class="modal" id="modal"><div class="sheet"><h3>Add Item</h3><label>Item name</label><input id="itemName" placeholder="e.g. Coke Zero"><label>Category</label><select id="itemCategory"></select><label>Starting quantity</label><input id="itemQty" type="number" min="0" step="1" value="0"><div class="actions"><button class="secondary" id="cancelBtn">Cancel</button><button class="primary" id="saveBtn">Save Item</button></div></div></div>
<script>
const original=[["DRINKS","Schweppes"],["DRINKS","Brr"],["DRINKS","Mountain dew"],["DRINKS","Coke zero"],["DRINKS","Sprite"],["DRINKS","500ml water"],["DRINKS","Pocari 500ml"],["DRINKS","Welch grape"],["DRINKS","Welch orange"],["DRINKS","Arizona lemon"],["DRINKS","Arizona peach"],["PACKAGING","16oz cups"],["PACKAGING","22 oz cups"],["PACKAGING","12oz papercups"],["PACKAGING","Brown kraft"],["PACKAGING","White kraft"],["CAKES","Classic Tiramisu cake"],["CAKES","Matcha Tiramisu cake"],["CAKES","Biscoff Tiramisu cake"],["BOUQUETS","350 dried flowers"],["BOUQUETS","500 dried flowers"],["BOUQUETS","2000 peonies"],["BOUQUETS","1000 singlerose"],["BOUQUETS","1,500 preserved"],["BOUQUETS","2,500 preserved"],["BOUQUETS","3,500 preserved"],["BOUQUETS","1000/pax Pampass"],["FLOWERS + COFFEE","Flowers + coffee (799)"]];
const labels={DRINKS:"Drinks",PACKAGING:"Cups & Packaging",CAKES:"Food & Cakes",BOUQUETS:"Bouquets","FLOWERS + COFFEE":"Flowers + Coffee"}, key="kinlove_foh_inventory_v1";
let data=JSON.parse(localStorage.getItem(key)||"null")||original.map(([category,name])=>({id:crypto.randomUUID(),category,name,qty:0,updated:new Date().toISOString()}));
function save(){localStorage.setItem(key,JSON.stringify(data));render()}function fmt(s){return new Date(s).toLocaleString([],{year:"numeric",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}
function render(){let r=document.getElementById("inventory");r.innerHTML="";[...new Set(data.map(x=>x.category))].forEach(cat=>{let a=data.filter(x=>x.category===cat),box=document.createElement("section");box.className="category";box.innerHTML=`<div class="cathead"><h2>${labels[cat]||cat}</h2><span class="count">${a.length} items</span></div>`;a.forEach(x=>{let row=document.createElement("div");row.className="item";row.innerHTML=`<div><div class="name"></div><div class="updated">Updated: ${fmt(x.updated)}</div></div><div class="controls"><button class="minus">−</button><div class="qty">${x.qty}</div><button class="plus">+</button><button class="del">🗑</button></div>`;row.querySelector(".name").textContent=x.name;row.querySelector(".minus").onclick=()=>change(x.id,-1);row.querySelector(".plus").onclick=()=>change(x.id,1);row.querySelector(".del").onclick=()=>{if(confirm(`Delete "${x.name}" from inventory?`)){data=data.filter(a=>a.id!==x.id);save()}};box.appendChild(row)});r.appendChild(box)});if(!data.length)r.innerHTML='<div class="category" style="text-align:center;color:var(--muted)">No inventory items yet.</div>'}
function change(id,d){let x=data.find(a=>a.id===id);x.qty=Math.max(0,x.qty+d);x.updated=new Date().toISOString();save()}
const modal=document.getElementById("modal"),name=document.getElementById("itemName"),qty=document.getElementById("itemQty"),cat=document.getElementById("itemCategory");
document.getElementById("addBtn").onclick=()=>{cat.innerHTML=Object.keys(labels).map(k=>`<option value="${k}">${labels[k]}</option>`).join("");name.value="";qty.value=0;modal.classList.add("show");name.focus()};document.getElementById("cancelBtn").onclick=()=>modal.classList.remove("show");
document.getElementById("saveBtn").onclick=()=>{let n=name.value.trim();if(!n)return alert("Please enter an item name.");data.push({id:crypto.randomUUID(),category:cat.value,name:n,qty:Math.max(0,Number(qty.value)||0),updated:new Date().toISOString()});save();modal.classList.remove("show")};
document.getElementById("resetBtn").onclick=()=>{if(confirm("Reset to the original item list?")){data=original.map(([category,name])=>({id:crypto.randomUUID(),category,name,qty:0,updated:new Date().toISOString()}));save()}};
modal.onclick=e=>{if(e.target===modal)modal.classList.remove("show")};render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
