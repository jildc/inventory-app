        <h2>Kinlove Inventory</h2>
        <p class="muted">Secure inventory management</p>
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Password">
        <button id="loginBtn" class="primary">Unlock</button>
        <button id="forgotBtn" class="linkBtn">Forgot password?</button>
        <div id="setupBox" class="hidden">
          <hr>
          <p class="small">First-time setup</p>
          <input id="newPassword" type="password" placeholder="Create password">
          <input id="recoveryEmail" type="email" placeholder="Recovery email address">
          <button id="setupBtn" class="primary">Create secure password</button>
          <p class="small muted">Your inventory stays on this device. Email password recovery needs the optional email service configuration described in README.md.</p>
        </div>
        <div id="recoveryBox" class="hidden">
          <hr>
          <input id="recoveryEmailInput" type="email" placeholder="Recovery email address">
          <button id="recoveryBtn" class="secondary">Start recovery</button>
          <p id="recoveryMsg" class="small"></p>
        </div>
      </div>
    </section>

    <section id="inventoryScreen" class="screen hidden">
      <div class="tabs">
        <button class="tab active" data-inv="foh">📠 FOH Inventory</button>
        <button class="tab" data-inv="kitchen">🍳 Kitchen Inventory</button>
      </div>
      <div class="toolbar">
        <button id="addItemBtn" class="secondary">➕ Add item</button>
        <button id="undoBtn" class="secondary">↩️ Undo</button>
        <button id="resetBtn" class="secondary">🔄 Reset quantities</button>
        <button id="finalizeBtn" class="primary">🔒 Finalize / Lock</button>
      </div>
      <div id="inventory"></div>
      <div class="footerActions">
        <button id="saveBtn" class="primary">💾 Save update</button>
      </div>
    </section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modalCard">
    <button id="closeModal" class="close">×</button>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>

<script>const $=s=>document.querySelector(s);
let DATA, state=JSON.parse(localStorage.getItem("kinloveInventoryState")||"null");
let current="foh", locked=false, undoStack=[];
const now=()=>new Date().toLocaleString();
async function load(){DATA=await fetch("data.json").then(r=>r.json()); if(!state){state={quantities:{},notes:{},custom:{},lastUpdated:null}; seed();} render();}
function seed(){for(const inv of ["foh","kitchen"]) for(const sec of Object.keys(DATA[inv])) for(const name of DATA[inv][sec]){let k=inv+"|"+sec+"|"+name;if(!(k in state.quantities))state.quantities[k]=0;if(!(k in state.notes))state.notes[k]="";}}
function save(){localStorage.setItem("kinloveInventoryState",JSON.stringify(state)); $("#lastSaved").textContent=state.lastUpdated?"Updated "+state.lastUpdated:"Ready";}
function snap(){undoStack.push(JSON.stringify(state));if(undoStack.length>30)undoStack.shift()}
function render(){seed(); $("#inventory").innerHTML=""; for(const [sec,names] of Object.entries(DATA[current])){const box=document.createElement("div");box.className="section";box.innerHTML=`<h2>${sec}</h2>`;for(const name of names) addRow(box,sec,name,false);for(const name of (state.custom[current+"|"+sec]||[])) addRow(box,sec,name,true);$("#inventory").appendChild(box)}}
function addRow(box,sec,name,custom){const k=current+"|"+sec+"|"+name;const row=document.createElement("div");row.className="item";row.innerHTML=`<div class="itemName">${name}</div><input class="qty" type="number" min="0" step="any" value="${state.quantities[k]??0}" ${locked?"disabled":""}>${custom&&!locked?'<button class="delete">🗑️</button>':'<span></span>'}${sec==="CONDIMENTS"?`<textarea class="notes" placeholder="Notes" ${locked?"disabled":""}>${state.notes[k]||""}</textarea>`:""}`;const q=row.querySelector(".qty");q.onchange=()=>{snap();state.quantities[k]=Number(q.value)||0;};const n=row.querySelector(".notes");if(n)n.onchange=()=>{snap();state.notes[k]=n.value};const d=row.querySelector(".delete");if(d)d.onclick=()=>{snap();state.custom[current+"|"+sec]=(state.custom[current+"|"+sec]||[]).filter(x=>x!==name);delete state.quantities[k];delete state.notes[k];render()};box.appendChild(row)}
function showModal(title,body){$("#modalTitle").textContent=title;$("#modalBody").innerHTML=body;$("#modal").classList.remove("hidden")}
$("#closeModal").onclick=()=>$("#modal").classList.add("hidden");$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.add("hidden")};
$("#addItemBtn").onclick=()=>{if(locked)return alert("Inventory is locked. Unlock first.");showModal("Add inventory item",`<input id="newName" placeholder="Item name"><select id="newSec">${Object.keys(DATA[current]).map(x=>`<option>${x}</option>`).join("")}</select><div class="modalActions"><button class="primary" id="doAdd">Add item</button></div>`);$("#doAdd").onclick=()=>{const n=$("#newName").value.trim(),s=$("#newSec").value;if(!n)return;if(!state.custom[current+"|"+s])state.custom[current+"|"+s]=[];if(!state.custom[current+"|"+s].includes(n))state.custom[current+"|"+s].push(n);snap();state.quantities[current+"|"+s+"|"+n]=0;state.notes[current+"|"+s+"|"+n]="";$("#modal").classList.add("hidden");render()}};
$("#undoBtn").onclick=()=>{if(!undoStack.length)return alert("Nothing to undo.");state=JSON.parse(undoStack.pop());save();render()};
$("#resetBtn").onclick=()=>{if(locked)return alert("Inventory is locked. Unlock first.");if(confirm("Reset all quantities in this inventory to 0?")){snap();for(const sec of Object.keys(DATA[current]))for(const n of [...DATA[current][sec],...(state.custom[current+"|"+sec]||[])])state.quantities[current+"|"+sec+"|"+n]=0;state.lastUpdated=now();save();render()}};
$("#saveBtn").onclick=()=>{if(locked)return alert("Unlock the inventory before saving.");state.lastUpdated=now();save();alert("Inventory update saved at "+state.lastUpdated)};
$("#finalizeBtn").onclick=()=>{if(locked)return;state.lastUpdated=now();save();locked=true;render();$("#finalizeBtn").textContent="🔒 Locked";};
$("#lockBtn").onclick=()=>{locked=true;render()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{current=b.dataset.inv;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));render()});
let hasPassword=localStorage.getItem("kinlovePasswordHash");
async function hash(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
$("#loginBtn").onclick=async()=>{const h=await hash($("#passwordInput").value);if(h===localStorage.getItem("kinlovePasswordHash")){unlock()}else alert("Incorrect password.")};
function unlock(){locked=false;$("#loginScreen").classList.add("hidden");$("#inventoryScreen").classList.remove("hidden");render()}
$("#setupBtn").onclick=async()=>{const p=$("#newPassword").value,e=$("#recoveryEmail").value.trim();if(p.length<6||!e)return alert("Enter a password of at least 6 characters and a recovery email.");localStorage.setItem("kinlovePasswordHash",await hash(p));localStorage.setItem("kinloveRecoveryEmail",e);$("#setupBox").classList.add("hidden");alert("Password created. Please unlock with your new password.")};
$("#forgotBtn").onclick=()=>{if(!localStorage.getItem("kinlovePasswordHash")){$("#setupBox").classList.remove("hidden");return}$("#recoveryBox").classList.toggle("hidden")};
$("#recoveryBtn").onclick=()=>{const e=$("#recoveryEmailInput").value.trim();const saved=localStorage.getItem("kinloveRecoveryEmail");$("#recoveryMsg").textContent=e&&e===saved?"Recovery email matches. For a real email reset link, connect the optional EmailJS/Firebase recovery service in README.md.":"That email does not match the recovery email saved on this device."};
if(!hasPassword)$("#setupBox").classList.remove("hidden");
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
load();
</script>
</body>
</html>
